name: elm_obd2
description: "OBD2 AI Diagnostic App powered by Gemini"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  google_generative_ai: ^0.4.3
  flutter_bluetooth_serial: ^0.4.0
  permission_handler: ^11.3.0
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  pdf: ^3.10.8
  printing: ^5.12.0
  http: ^1.2.1
  web_socket_channel: ^2.4.0
  cupertino_icons: ^1.0.8
  fl_chart: ^0.71.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: assets/logo/app_icon.png
  adaptive_icon_background: "#131313"
  adaptive_icon_foreground: assets/logo/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/logo/app_icon.png
